name: Independent release build
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          bash ci/toolchains.sh "$RUNNER_TEMP/toolchains"
          echo "$RUNNER_TEMP/toolchains/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/toolchains/bin" >> "$GITHUB_PATH"
      - run: |
          go test ./...
          # Fetch web dependencies (lockfile integrity-checked) before the offline release build,
          # exactly as the Forgejo workflow does; the release build itself installs with --offline.
          (cd web && bun install --frozen-lockfile --ignore-scripts)
          make release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          files=(aqmas-darwin-arm64 aqmas-linux-amd64 aqmas-linux-arm64 aqmasd-linux-arm64)
          # SHA256SUMS keeps its four names (brokers 0.9.0-0.9.2 refuse any other line);
          # builds added since are listed in SHA256SUMS.extra.
          extra=(aqmas-darwin-amd64)
          for f in "${files[@]}" "${extra[@]}" SHA256SUMS SHA256SUMS.extra; do [[ -f $f && ! -L $f ]]; done
          sha256sum "${files[@]}" | cmp - SHA256SUMS
          sha256sum "${extra[@]}" | cmp - SHA256SUMS.extra
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${files[@]}" "${extra[@]}" SHA256SUMS SHA256SUMS.extra --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
  # Optional: compare with the same release built independently by a second source (for
  # example the Forgejo workflow in .forgejo/workflows/release.yml running on another forge).
  # Where that is comes only from this repository's settings, never from the code: the
  # Actions *secret*
  #   SECOND_SOURCE_RELEASES_URL = https://forge.example.com/OWNER/NAME/releases/download
  # It is read from a secret only. A repository variable would be printed in the job log,
  # which is public for a public repository; a secret is masked. Nothing below prints the
  # URL or any part of it. With the secret unset the job says so and passes: GitHub is then
  # the only published source, and installations still rebuild from source and compare.
  compare:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SECOND_SOURCE_RELEASES_URL: ${{ secrets.SECOND_SOURCE_RELEASES_URL }}
        run: |
          set -eu
          base=${SECOND_SOURCE_RELEASES_URL%/}
          if [ -z "$base" ]; then
            echo '::notice::No second release source is configured (the secret SECOND_SOURCE_RELEASES_URL is unset); nothing to compare.'
            exit 0
          fi
          case "$base" in https://*) ;; *) echo 'SECOND_SOURCE_RELEASES_URL must be an https URL'; exit 1 ;; esac
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS
          # A forge answers a release download with a redirect to the attachment: follow it,
          # https only. Quiet on purpose: curl's own messages would name the host in a public
          # log, so its stderr is discarded and only the final status code is printed.
          code=$(curl --max-time 30 -s -L --proto '=https' --proto-redir '=https' --max-redirs 5 -o second.sums -w '%{http_code}' "$base/$GITHUB_REF_NAME/SHA256SUMS" 2>/dev/null) || code=000
          served=0
          case "$code" in
            200) cmp -s SHA256SUMS second.sums || { echo 'The second source published a different SHA256SUMS.'; exit 1; }
                 served=1
                 echo 'The second source published the same SHA256SUMS.' ;;
            000|401|403|404) echo "::notice::The second source did not serve the manifest to this runner (status $code); an installation that configures it still requires matching manifests." ;;
            *) echo "Unexpected status $code from the second source"; exit 1 ;;
          esac
          # SHA256SUMS.extra (every release from 0.9.3) is compared the same way. A second
          # source that served SHA256SUMS must serve it too: one without it is incomplete.
          v=${GITHUB_REF_NAME#v}
          need_extra=0
          if [ "$(printf '%s\n' 0.9.3 "$v" | sort -V | head -n1)" = 0.9.3 ]; then need_extra=1; fi
          if [ "$need_extra" = 1 ]; then
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.extra
            code=$(curl --max-time 30 -s -L --proto '=https' --proto-redir '=https' --max-redirs 5 -o second.extra -w '%{http_code}' "$base/$GITHUB_REF_NAME/SHA256SUMS.extra" 2>/dev/null) || code=000
            case "$code" in
              200) cmp -s SHA256SUMS.extra second.extra || { echo 'The second source published a different SHA256SUMS.extra.'; exit 1; }
                   echo 'The second source published the same SHA256SUMS.extra.' ;;
              404) if [ "$served" = 1 ]; then echo 'The second source published SHA256SUMS but no SHA256SUMS.extra.'; exit 1; fi
                   echo "::notice::The second source did not serve SHA256SUMS.extra to this runner (status $code)." ;;
              000|401|403) echo "::notice::The second source did not serve SHA256SUMS.extra to this runner (status $code)." ;;
              *) echo "Unexpected status $code from the second source"; exit 1 ;;
            esac
          fi
