# /etc/aqmas/config.toml (root:aqmas 0640). No secrets belong here: keys are generated into
# data_dir on first start; the ntfy topic URL is the only capability-like value.

listen_agent    = ":8443"                       # agent API, TLS 1.3 + client certificates
listen_web      = "127.0.0.1:8080"              # web UI/API, reached only via cloudflared
data_dir        = "/var/lib/aqmas"
public_base_url = "https://approvals.example.com" # approve links, WebAuthn RP ID and origin
owner_name      = "alice"
# SANs of the agent-API server certificate (issued by the internal CA; clients pin that CA).
tls_sans        = ["192.0.2.60", "bastion"]
client_cert_days = 730                          # host client certificates from enrollment

[ttl]
default_seconds           = 1800   # 30 min
max_seconds               = 28800  # 8 h
min_seconds               = 60
pending_expiry_seconds    = 600    # undecided requests expire after 10 min
enrollment_expiry_seconds = 3600
max_standing_hours        = 24     # "approve similar requests for N hours"

[ntfy]
# Random topic name; leave empty to disable notifications.
topic_url = ""   # e.g. "https://ntfy.sh/<random-topic>"

[access]
# Cloudflare Access application for approvals.example.com. When both are set, web requests without a
# valid Cf-Access-Jwt-Assertion are refused (defence in depth; passkeys are the boundary).
team_domain = ""  # e.g. "<team>.cloudflareaccess.com"
aud         = ""  # the Access application's AUD tag
owner_email = ""  # if set, the Access identity's email must match; sessions are bound to its sub

# Hosts aqmas may issue SSH certificates for. Principal: "<login_user>@<name>" (see docs/HOSTS.md).
[[targets]]
name     = "db-1"
address  = "192.0.2.61"
port     = 22
users    = ["alice"]
# host_key = "ssh-ed25519 AAAA..."   # pinned; emitted as a known_hosts line in grants

[[targets]]
name     = "dev-1"
address  = "192.0.2.62"
users    = ["alice"]

# Forgejo's built-in SSH server maps a certificate principal to the user account that registered
# it ("Manage SSH Certificate Principals"), so the principal is set explicitly. It must contain
# "@" so it can never double as a Unix login name on a host that trusts the CA. It probably does
# not enforce source-address, so keep Forgejo grants short.
[[targets]]
name            = "forgejo"
address         = "192.0.2.50"
port            = 2222
users           = ["git"]
principal       = "alice@forgejo"  # register this exact string in Forgejo
max_ttl_seconds = 3600
