# /etc/aqmas/config.toml (root:aqmas 0640). No secrets belong here: keys are generated into
# data_dir on first start; the ntfy topic URL is the only capability-like value.

listen_agent    = ":8443"                       # agent API, TLS 1.3 + client certificates
listen_web      = "127.0.0.1:8080"              # web UI/API, reached only via cloudflared
data_dir        = "/var/lib/aqmas"
public_base_url = "https://approvals.example.com" # approve links, WebAuthn RP ID and origin
owner_name      = "alice"
# SANs of the agent-API server certificate (issued by the internal CA; clients pin that CA).
tls_sans        = ["192.0.2.60", "bastion"]
client_cert_days = 730                          # host client certificates from enrollment

[ttl]
default_seconds           = 1800   # 30 min
max_seconds               = 28800  # 8 h
min_seconds               = 60
pending_expiry_seconds    = 600    # undecided requests expire after 10 min
enrollment_expiry_seconds = 3600
max_standing_hours        = 24     # "approve similar requests for N hours"

[ntfy]
# Random topic name; leave empty to disable notifications.
topic_url = ""   # e.g. "https://ntfy.sh/<random-topic>"

[access]
# Cloudflare Access application for approvals.example.com. When both are set, web requests without a
# valid Cf-Access-Jwt-Assertion are refused (defence in depth; passkeys are the boundary).
team_domain = ""  # e.g. "<team>.cloudflareaccess.com"
aud         = ""  # the Access application's AUD tag
owner_email = ""  # if set, the Access identity's email must match; sessions are bound to its sub

# Cloudflare API access through aqmasd (milestone 2, docs/CLOUDFLARE.md). Off unless enabled.
# The parent tokens are NOT in this file: they are root-owned files in /etc/aqmas handed over by
# systemd LoadCredential= (see aqmasd.service), referred to here by credential name.
# [cloudflare]
# enabled    = true
# account_id = "<32 lowercase hex>"
# proxy_token_credential  = "cf-proxy-token"    # LoadCredential=cf-proxy-token:/etc/aqmas/cf-proxy-token
# minter_token_credential = "cf-minter-token"   # optional: without it token mode is off
# # proxy_token_file = "/etc/aqmas/cf-proxy-token"  # alternative: owned by user aqmas, mode 0600/0400
# token_ip_condition = ["<static home IPv4>/32"] # child tokens only work from here; empty = token mode off
# # snapshot_dir = "/var/lib/aqmas/cf-snapshots"   # default <data_dir>/cf-snapshots
# # snapshot_retention_days = 7                    # 1..7; newest per object always kept
# # rate_per_minute = 600
# # write_rate_per_minute = 60
# # Guard-rail facts, all empty by default (a guard that needs one then does not apply):
# protected_access_hostnames = ["id.example.com"] # never an Access app, Workers route/domain, tunnel rule change; aqmasd warns when empty
# # protected_dns_names = ["id.example.com"]
# # traefik_origin = "https://192.0.2.10:443"       # tunnel services here need originServerName = hostname
# # traefik_plain_origins = ["http://192.0.2.10"]  # refused as tunnel services (redirect loop)
# # email_forward_allow = ["owner@example.net"]    # cf.email forwards only here
#
# # Names agents use in scope parameters; aqmasd maps them to ids. Anything not listed here can
# # only be reached with cf.admin.
# [[cloudflare.zones]]
# name = "example.com"
# id   = "<32 hex zone id>"
# [[cloudflare.tunnels]]
# name = "home"
# id   = "<tunnel uuid>"
# [[cloudflare.d1_databases]]
# name = "app-db"
# id   = "<database uuid>"
#
# # Data bindings a Worker or Pages project may have when deployed through cf.workers.deploy /
# # cf.pages (default: none; plain/secret vars, assets, AI etc. are always allowed).
# [[cloudflare.worker_bindings]]
# script = "hello"
# allow  = ["d1:app-db", "r2:<bucket>", "kv:<namespace-id>", "service:<script>", "queue:<name>"]
# [[cloudflare.worker_bindings]]
# pages_project = "<project>"
# allow  = ["d1:app-db"]
#
# # Built-in scopes can only be narrowed:
# [cloudflare.scopes."cf.read"]
# no_auto_approve = true
# [cloudflare.scopes."cf.email"]
# disabled = true
# [cloudflare.scopes."cf.workers.deploy"]
# max_ttl_seconds = 3600
# no_token_mode   = true

# Hosts aqmas may issue SSH certificates for. Principal: "<login_user>@<name>" (see docs/HOSTS.md).
[[targets]]
name     = "db-1"
address  = "192.0.2.61"
port     = 22
users    = ["alice"]
# host_key = "ssh-ed25519 AAAA..."   # pinned; emitted as a known_hosts line in grants

[[targets]]
name     = "dev-1"
address  = "192.0.2.62"
users    = ["alice"]

# Forgejo's built-in SSH server maps a certificate principal to the user account that registered
# it ("Manage SSH Certificate Principals"), so the principal is set explicitly. It must contain
# "@" so it can never double as a Unix login name on a host that trusts the CA. It probably does
# not enforce source-address, so keep Forgejo grants short.
[[targets]]
name            = "forgejo"
address         = "192.0.2.50"
port            = 2222
users           = ["git"]
principal       = "alice@forgejo"  # register this exact string in Forgejo
max_ttl_seconds = 3600
