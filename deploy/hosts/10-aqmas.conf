# managed by aqmas install-host-trust.sh (agent-quartermaster, docs/HOSTS.md)
# Accept SSH user certificates signed by the aqmas user CA, for the principals listed in
# /etc/ssh/aqmas_principals/<login user> ("alice@<this host's aqmas name>").
# Only certificate logins are affected: authorized_keys logins keep working.
# sshd uses the first value it reads for these keywords, so no earlier file may set them.
TrustedUserCAKeys /etc/ssh/aqmas_user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/aqmas_principals/%u
